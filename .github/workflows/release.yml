name: Release
on:
  workflow_dispatch:
  push:
    branches: [main, dev]

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/reseam/ci:2026.11.19
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUNDLE_SIGNING_KEY_B64: ${{ secrets.BUNDLE_SIGNING_KEY_B64 }}
      RESEAM_HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.bun/install/cache
            ~/.npm
          key: deps-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'bun.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - uses: oven-sh/setup-bun@v2
      - run: bun ci

      - name: Release
        id: release
        uses: cycjimmy/semantic-release-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest@v4
        with:
          subject-path: build/reseam/*.reseam