name: Release
on:
  workflow_dispatch:
  push:
    branches: [main, dev]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RESEAM_BIN: ${{ github.workspace }}/engine/reseam
      RESEAM_BUNDLE_KEY: ${{ github.workspace }}/bundle-signing.key
      RELEASE_TOKEN: ${{ github.token }}
      BUNDLE_SIGNING_KEY_B64: ${{ secrets.BUNDLE_SIGNING_KEY_B64 }}
      RESEAM_HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - uses: oven-sh/setup-bun@v2
      - run: bun ci

      - name: Tag
        id: tag
        uses: cycjimmy/semantic-release-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v6
        if: steps.tag.outputs.new_release_published == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        if: steps.tag.outputs.new_release_published == 'true'

      - name: Install the Reseam CLI and signing key
        if: steps.tag.outputs.new_release_published == 'true'
        run: |
          mkdir -p engine
          version=$(sed -n 's/.*id("app.reseam.workspace") version "\(.*\)".*/\1/p' settings.gradle.kts)
          curl -fsSL -o engine/reseam https://cdn.reseam.app/engine/v$version/reseam-linux-x64
          chmod +x engine/reseam
          printf '%s' "$BUNDLE_SIGNING_KEY_B64" | base64 -d > bundle-signing.key

      - name: Build the bundle
        if: steps.tag.outputs.new_release_published == 'true'
        env:
          TAG: ${{ steps.tag.outputs.new_release_git_tag }}
        run: ./gradlew bundle -PreleaseTag=$TAG --no-daemon

      - name: Publish the release
        if: steps.tag.outputs.new_release_published == 'true'
        env:
          TAG: ${{ steps.tag.outputs.new_release_git_tag }}
        run: engine/reseam release patches build/reseam/*.reseam --tag $TAG

      - name: Attest
        if: steps.tag.outputs.new_release_published == 'true'
        uses: actions/attest@v4
        with:
          subject-path: build/reseam/*.reseam

      - name: Update the patch list in the README
        if: steps.tag.outputs.new_release_published == 'true' && github.ref_name == 'main'
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.tag.outputs.new_release_git_tag }}
        run: |
          engine/reseam bundle list --json build/reseam/*.reseam > build/patch-list.json
          git checkout "$BRANCH"
          node .github/scripts/patch-list.mjs build/patch-list.json README.md
          git diff --quiet README.md && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "docs: update the patch list for $TAG" README.md
          git push origin "$BRANCH"